missions:
  - id: research.question
    name: Research Question
    primary_case: research_question
    description: Answer a question by collecting, ranking, synthesizing, and checking sources.
    expected_roles: [lead, scout, analyst, critic]
    output_contract: research_report
  - id: generic.request
    name: Generic Request
    primary_case: generic
    description: Fallback mission for requests that do not match a specialized case.
    expected_roles: [lead]
    output_contract: clarification_or_plan
