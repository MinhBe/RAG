role_tags:
  - id: orchestrator
    description: Coordinates tasks, delegates work, summarizes state, and owns user-facing control flow.
  - id: planner
    description: Turns goals into implementation plans, milestones, contracts, and sequencing.
  - id: research
    description: Collects external/internal evidence and source material.
  - id: analyst
    description: Interprets evidence, ranks options, and turns facts into decisions.
  - id: implementation
    description: Writes or modifies implementation artifacts under a bounded contract.
  - id: security
    description: Reviews threats, abuse paths, permission boundaries, and defensive controls.
  - id: reviewer
    description: Reviews quality without directly authoring the implementation under review.
  - id: documentation
    description: Writes or reviews documentation, reports, and user-facing explanations.
  - id: validator
    description: Runs checks, validates outcomes, and reports pass/fail with evidence.
  - id: monitor
    description: Watches conditions and raises events; schedule/event is activation, not a role.
  - id: critic
    description: Adversarially challenges assumptions, plans, outputs, and failure modes.
  - id: design_publishing
    description: Handles UI, visual, rendering, presentation, or publishing-oriented work.
