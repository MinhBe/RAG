[project]
name = "hermes"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.142.2",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["training/seqgan/vendor"]

